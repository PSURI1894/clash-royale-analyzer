[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cr-helper"
version = "0.0.1"
description = "Clash Royale Simulator, Deck Maker & Analyzer — backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Postgres driver — only needed for the Docker/production stack, not for local SQLite dev.
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["cr_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
