# Full local stack. Start with: docker compose up -d
# (Requires Docker Desktop running. Not needed for SQLite-based local dev.)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cr
      POSTGRES_PASSWORD: cr
      POSTGRES_DB: cr_helper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cr -d cr_helper"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  neo4jdata:
